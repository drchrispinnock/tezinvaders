AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TezInvaders score verifier: one Lambda behind a public Function URL. It replays recorded
  games and signs score attestations the contract checks (see verifier/). Its keys live in a
  Secrets Manager secret (deploy/verifier-secret.sh). Create the stack, upload the bundle
  (deploy/verifier-deploy.sh) and put the FunctionUrl output into .env.production as
  VITE_VERIFIER_URL.
Parameters:
  VerifierSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding the verifier keys (deploy/verifier-secret.sh prints it).
    AllowedPattern: "^arn:aws:secretsmanager:.+"
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-verifier-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref VerifierSecretArn
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tezinvaders-verifier
      Runtime: nodejs22.x
      Handler: lambda.handler
      Role: !GetAtt Role.Arn
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          VERIFIER_SECRET_ARN: !Ref VerifierSecretArn
      # Placeholder until deploy/verifier-deploy.sh uploads the real bundle.
      Code:
        ZipFile: |
          export const handler = async () => ({ statusCode: 503, body: '{"error":"verifier not deployed yet"}' });
  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: [POST, GET]
        AllowHeaders: [content-type]
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  # Public function URLs need the plain invoke permission too.
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
Outputs:
  FunctionUrl:
    Value: !GetAtt Url.FunctionUrl
    Description: Put this (without the trailing slash) into .env.production as VITE_VERIFIER_URL.
